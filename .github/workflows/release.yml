name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2

      - name: Download FFmpeg
        shell: bash
        run: |
          mkdir -p assets/ffmpeg/windows-x86_64
          curl -L -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          unzip -j ffmpeg.zip "*/bin/ffmpeg.exe" -d assets/ffmpeg/windows-x86_64/

      - name: Build release
        run: cargo build --release -p nezha-egui

      - name: Package
        shell: pwsh
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist
          Copy-Item "target\release\nezha-egui.exe" $dist\
          Copy-Item "target\release\ffmpeg.exe" $dist\
          Copy-Item -Recurse "assets\palettes" $dist\
          Copy-Item "assets\MiSans-Regular.otf" $dist\
          $name = "nezha-${{ github.ref_name }}-windows-x86_64.zip"
          Compress-Archive -Path "$dist\*" -DestinationPath $name

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: nezha-${{ github.ref_name }}-windows-x86_64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2

      - name: Install FFmpeg
        run: |
          brew install ffmpeg
          mkdir -p assets/ffmpeg/macos-aarch64
          cp "$(brew --prefix ffmpeg)/bin/ffmpeg" assets/ffmpeg/macos-aarch64/

      - name: Build release
        run: cargo build --release -p nezha-egui

      - name: Assemble .app
        run: |
          APP="Nezha.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          cp target/release/nezha-egui "$APP/Contents/MacOS/"
          cp assets/ffmpeg/macos-aarch64/ffmpeg "$APP/Contents/MacOS/"
          cp -r assets/palettes "$APP/Contents/Resources/"
          cp assets/MiSans-Regular.otf "$APP/Contents/Resources/"

          cat > "$APP/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>nezha-egui</string>
              <key>CFBundleIdentifier</key>
              <string>com.jieneng.nezha</string>
              <key>CFBundleName</key>
              <string>Nezha</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ github.ref_name }}</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
          </dict>
          </plist>
          EOF

          zip -r "nezha-${{ github.ref_name }}-macos-aarch64.zip" "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: nezha-${{ github.ref_name }}-macos-aarch64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release -p nezha-egui

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/nezha-egui dist/
          cp -r assets/palettes dist/
          cp assets/MiSans-Regular.otf dist/
          cat > dist/README-Linux.txt << 'EOF'
          Nezha for Linux
          ===============

          Please install FFmpeg first:
            Ubuntu/Debian:  sudo apt install ffmpeg
            Arch Linux:     sudo pacman -S ffmpeg
            Fedora:         sudo dnf install ffmpeg

          Then run: ./nezha-egui
          EOF
          tar czf "nezha-${{ github.ref_name }}-linux-x86_64.tar.gz" -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: nezha-${{ github.ref_name }}-linux-x86_64.tar.gz

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*-build"
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
